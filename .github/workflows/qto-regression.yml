name: QTO regressions
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m compileall -q skills tests
      - run: python -m pytest tests -q
      - run: python tests/run_html_review_tests.py --root skills --output-root .codex_work/html-review
      - run: node tests/run_html_review_ui_tests.mjs --root skills --report .codex_work/html-review/最新核验.json
      - run: node --test feedback-service/tests/*.test.mjs
      - run: npm ci --no-audit --no-fund
        working-directory: feedback-service
      - run: npm run check
        working-directory: feedback-service
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm run test:runtime
        working-directory: feedback-service
